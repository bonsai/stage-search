name: Date Agent

on:
  workflow_dispatch:
    inputs:
      date:
        description: "Date YYYY-MM-DD"
        required: false
      area:
        description: "Area, e.g. 新宿 / 下北沢 / 渋谷"
        required: false
  schedule:
    - cron: "30 7 * * *"

permissions:
  contents: write

jobs:
  date-agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build date plan
        env:
          TARGET_DATE: ${{ inputs.date }}
          AREA: ${{ inputs.area }}
        run: |
          if [ -n "$TARGET_DATE" ]; then
            python scripts/date_agent.py "$TARGET_DATE" "$AREA"
          else
            python scripts/date_agent.py
          fi
      - name: Commit plan
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/date-plans.json
          git diff --cached --quiet || git commit -m "data: update date plan"
          git push
