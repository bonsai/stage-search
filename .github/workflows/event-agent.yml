name: STAGE Event Search Agent

on:
  workflow_dispatch:
  schedule:
    - cron: '30 0 * * *'

permissions:
  contents: write

jobs:
  search:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run event search agent
        run: python scripts/event_agent.py

      - name: Commit event index
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/events.jsonl data/week.json
          git diff --cached --quiet || git commit -m 'chore: update stage event index'
          git push
